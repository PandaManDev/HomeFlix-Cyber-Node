name: Build HomeFlix Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'electron/**'
      - 'index.html'
      - 'renderer.js'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/build-windows-installer.yml'
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows NSIS installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HomeFlix-Cyber-Node-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

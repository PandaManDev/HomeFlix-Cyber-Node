name: Build HomeFlix Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "www/**"
      - "package.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner."
            exit 1
          fi
          # Accept available SDK licenses without failing when yes receives a closed pipe.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platforms/android-35" >> "$GITHUB_PATH"
      - name: Install app dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync HomeFlix into Android wrapper
        run: npx cap sync android
      - name: Build installable Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/HomeFlix-Cyber-Node-Android.apk
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeFlix-Cyber-Node-Android-APK
          path: release/HomeFlix-Cyber-Node-Android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.8.0
          name: HomeFlix Cyber Node v4.8.0
          files: release/HomeFlix-Cyber-Node-Android.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build HomeFlix Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "www/**"
      - "package.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install app dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync HomeFlix into Android wrapper
        run: npx cap sync android
      - name: Build installable Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/HomeFlix-Cyber-Node-Android.apk
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeFlix-Cyber-Node-Android-APK
          path: release/HomeFlix-Cyber-Node-Android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0
          name: HomeFlix Cyber Node v5.0.0
          files: release/HomeFlix-Cyber-Node-Android.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

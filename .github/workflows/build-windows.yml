name: Build HomeFlix Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "electron/**"
      - "scripts/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows NSIS installer
        run: npm run dist
      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeFlix-Cyber-Node-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish installer download for the website
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0
          name: HomeFlix Cyber Node v5.0.0
          files: release/HomeFlix-Cyber-Node-Setup-5.0.0.exe
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

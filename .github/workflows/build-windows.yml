name: Build HomeFlix Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "electron/**"
      - "scripts/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows NSIS installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HomeFlix-Cyber-Node-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

name: Test KStream public catalog
on:
  workflow_dispatch:
  push:
    branches: [feat/kstream-catalog-poc]
    paths:
      - 'scripts/kstream-catalog-poc.cjs'
      - '.github/workflows/kstream-catalog-test.yml'
permissions:
  contents: read
jobs:
  inspect-public-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect public KStream homepage
        id: inspect
        continue-on-error: true
        run: node scripts/kstream-catalog-poc.cjs > kstream-catalog-report.json
      - name: Show safe summary
        if: always()
        run: |
          if [ -f kstream-catalog-report.json ]; then
            node -e "const r=require('./kstream-catalog-report.json'); console.log(JSON.stringify({source:r.source, checkedAt:r.checkedAt, httpStatus:r.httpStatus, pageTitle:r.pageTitle, javascriptRequiredSignal:r.javascriptRequiredSignal, publicLinkCandidates:r.publicLinkCandidates, structuredDataBlocks:r.structuredDataBlocks, notes:r.notes}, null, 2))"
          else
            echo "The scraper stopped before producing a report."
          fi
      - name: Upload diagnostic report
        if: always() && hashFiles('kstream-catalog-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kstream-public-catalog-report
          path: kstream-catalog-report.json
          retention-days: 7

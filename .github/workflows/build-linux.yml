name: Build HomeFlix Linux Installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "renderer.js"
      - "electron/**"
      - "scripts/**"
      - "tools/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-linux.yml"

permissions:
  contents: write

concurrency:
  group: homeflix-linux-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux AppImage and Debian package
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm libfuse2

      - name: Read app version
        id: meta
        run: |
          node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Verify Linux installer outputs
        run: |
          test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)" || (ls -la release && exit 1)
          test -n "$(find release -maxdepth 1 -name '*.deb' -print -quit)" || (ls -la release && exit 1)
          ls -lh release/*.AppImage release/*.deb

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: HomeFlix-Cyber-Node-Linux-Installers
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish Linux installer downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-linux-build.${{ github.run_number }}
          name: HomeFlix Cyber Node v${{ steps.meta.outputs.version }} Linux (Build ${{ github.run_number }})
          body: |
            Linux packages built from the main branch.

            - **AppImage**: portable Linux app; make it executable and run it.
            - **DEB**: installer package for Debian, Ubuntu, Linux Mint, and compatible distributions.
          files: |
            release/*.AppImage
            release/*.deb
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

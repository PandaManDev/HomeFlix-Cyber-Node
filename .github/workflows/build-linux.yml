name: Build HomeFlix Linux Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "electron/**"
      - "scripts/**"
      - "tools/uninstall-homeflix-linux.sh"
      - "tools/uninstall-homeflix-linux.py"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-linux.yml"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
      - name: Install Node dependencies
        run: npm install
      - name: Build Linux AppImage and Debian package
        run: npm run dist:linux
      - name: Build standalone graphical Linux uninstaller
        run: |
          python3 -m venv --system-site-packages .venv-uninstaller
          .venv-uninstaller/bin/python -m pip install --upgrade pip pyinstaller
          .venv-uninstaller/bin/pyinstaller --noconfirm --clean --onefile --windowed --name HomeFlix-Linux-Uninstaller tools/uninstall-homeflix-linux.py
          chmod +x dist/HomeFlix-Linux-Uninstaller
      - name: Prepare shell uninstaller fallback
        run: chmod +x tools/uninstall-homeflix-linux.sh
      - name: Upload Linux packages and uninstaller apps as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HomeFlix-Cyber-Node-Linux
          path: |
            release/*.AppImage
            release/*.deb
            dist/HomeFlix-Linux-Uninstaller
            tools/uninstall-homeflix-linux.sh
          if-no-files-found: error
          retention-days: 14
      - name: Publish Linux packages and uninstaller apps to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.8.0
          name: HomeFlix Cyber Node v4.8.0
          files: |
            release/*.AppImage
            release/*.deb
            dist/HomeFlix-Linux-Uninstaller
            tools/uninstall-homeflix-linux.sh
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

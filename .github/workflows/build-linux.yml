name: Build HomeFlix Linux Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "electron/**"
      - "scripts/**"
      - "tools/uninstall-homeflix-linux.sh"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-linux.yml"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Linux AppImage and Debian package
        run: npm run dist:linux
      - name: Prepare Linux uninstaller
        run: chmod +x tools/uninstall-homeflix-linux.sh
      - name: Upload Linux packages and uninstaller as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HomeFlix-Cyber-Node-Linux
          path: |
            release/*.AppImage
            release/*.deb
            tools/uninstall-homeflix-linux.sh
          if-no-files-found: error
          retention-days: 14
      - name: Publish Linux packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0
          name: HomeFlix Cyber Node v5.0.0
          files: |
            release/*.AppImage
            release/*.deb
            tools/uninstall-homeflix-linux.sh
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
